name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run source and numerical tests
        run: npm test

      - name: Build standalone demos
        run: npm run build

      - name: Run rendered browser checks
        run: npm run check:browser

      - name: Verify repository package
        run: npm run verify

      - name: Upload rendered evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-check-evidence
          path: |
            .artifacts/
            examples/neural-network/checks/
          if-no-files-found: ignore
          retention-days: 7
